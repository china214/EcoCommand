    <section class="hero">
      <div class="hero-inner">
        <h1>Data</h1>
        <p class="lede">
            Real-time sensor data from the system.
        </p>
        <div class="sensor-card">
            <h2>Temperature</h2>
            <p class="sensor-value"><span id="temp">--</span> °C</p>
        </div>

        <div class="sensor-card">
            <h2>Humidity</h2>
            <p class="sensor-value"><span id="hum">--</span> %</p>
        </div>
      </div>
    </section>

  <footer class="site-footer">GCU College of Engineering and Technology</footer>

    <script>
        async function updateData() {
            try {
            const res = await fetch("http://YOUR_PI_IP:5000/data");  // JSON FILE
            const data = await res.json();

            document.getElementById("temp").innerText = data.temperature_c;
            document.getElementById("hum").innerText = data.humidity_percent;
            } catch (err) {
            console.log("Error fetching data:", err);
            }
        }

        setInterval(updateData, 2000);
        updateData();
    </script>
